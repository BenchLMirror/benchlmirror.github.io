  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0c09;
      --bg-elev: #13110c;
      --border: rgba(232, 226, 210, 0.07);
      --border-strong: rgba(232, 226, 210, 0.16);
      --text: #ebe4d2;
      --text-bright: #f7f2e3;
      --text-dim: #8a8472;
      --text-muted: #46433b;

      --serif: 'Fraunces', 'Songti SC', 'Yu Mincho', 'Hiragino Mincho ProN', Georgia, 'Times New Roman', serif;
      --sans: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', sans-serif;

      --wrap-max: 1240px;
      --wrap-pad: 32px;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-feature-settings: 'kern', 'liga', 'ss01';
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 1200px 700px at 50% -10%, rgba(245, 230, 195, 0.025), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input { font: inherit; }

    ::selection { background: rgba(232, 226, 210, 0.18); color: var(--text-bright); }

    h1, h2, h3 { text-wrap: balance; font-weight: 400; }
    p { text-wrap: pretty; }

    .wrap {
      max-width: var(--wrap-max);
      margin: 0 auto;
      padding-left: var(--wrap-pad);
      padding-right: var(--wrap-pad);
    }

    /* ---------- HEADER ---------- */
    header { padding: 24px 0 18px; }

    .header__main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px 32px;
      flex-wrap: wrap;
    }

    .logo {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 21px;
      letter-spacing: -0.02em;
      color: var(--text-bright);
      flex-shrink: 0;
    }

    .lang { position: relative; flex-shrink: 0; }

    .lang__btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
      background: transparent;
      border: 0;
      color: var(--text-dim);
      font-family: var(--serif);
      font-style: italic;
      font-size: 14px;
      letter-spacing: 0.04em;
      transition: color 0.2s ease;
    }
    .lang__btn:hover { color: var(--text-bright); }
    .lang__code { line-height: 1; }

    .lang__icon {
      display: inline-flex;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 13px;
      flex-shrink: 0;
    }

    .lang__icon span {
      display: block;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform-origin: center;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .lang__btn[aria-expanded="true"] .lang__icon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .lang__btn[aria-expanded="true"] .lang__icon span:nth-child(2) { opacity: 0; }
    .lang__btn[aria-expanded="true"] .lang__icon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .lang__menu {
      position: absolute;
      top: calc(100% + 14px);
      right: 0;
      min-width: 160px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-elev);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.5);
      z-index: 50;
    }
    .lang__menu[hidden] { display: none; }

    .lang__menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      font-size: 13.5px;
      font-family: var(--sans);
      color: var(--text-dim);
      background: transparent;
      border: 0;
      border-radius: 6px;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .lang__menu button:hover { color: var(--text-bright); background: rgba(245, 240, 220, 0.04); }
    .lang__menu button.active { color: var(--text-bright); }

    .header__nav {
      display: flex;
      align-items: center;
      gap: 26px;
      flex-wrap: wrap;
      margin-top: 18px;
      font-size: 13.5px;
    }

    .header__nav-link {
      color: var(--text-dim);
      transition: color 0.2s ease;
    }
    .header__nav-link:hover { color: var(--text-bright); }
    .header__nav-link.is-active { color: var(--text-bright); }

    /* ---------- HERO ---------- */
    .hero {
      padding: 60px 0 50px;
      border-bottom: 1px solid var(--border);
    }

    .hero__title {
      font-family: var(--serif);
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      color: var(--text-bright);
      max-width: 900px;
      overflow-wrap: break-word;
      hyphens: manual;
    }

    .hero__title em { font-style: italic; font-weight: 300; }

    .hero__lede {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-dim);
      max-width: 560px;
    }

    .hero__meta {
      display: flex;
      gap: 36px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .hero__meta > div { display: flex; flex-direction: column; gap: 4px; }

    .hero__meta-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }

    .hero__meta-value {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      color: var(--text-bright);
      letter-spacing: -0.01em;
    }

    /* ---------- SECTION ---------- */
    .section { padding: 50px 0 80px; border-bottom: 1px solid var(--border); }

    /* ---------- CONTROLS ---------- */
    .models__controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .models__count {
      font-size: 13px;
      color: var(--text-dim);
    }

    .models__count strong {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      color: var(--text-bright);
      margin-left: 4px;
    }

    .models__search {
      background: transparent;
      border: 1px solid var(--border-strong);
      padding: 8px 14px;
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      width: 240px;
      transition: border-color 0.2s ease;
    }
    .models__search::placeholder { color: var(--text-muted); }
    .models__search:focus { outline: none; border-color: var(--text-dim); }

    /* ---------- TABLE ---------- */
    .models__table-wrap {
      border: 1px solid var(--border);
      overflow-x: auto;
      border-radius: 4px;
    }

    .models__table {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .models__table thead th {
      text-align: left;
      font-weight: 500;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-strong);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    .models__table thead th:hover { color: var(--text); }
    .models__table thead th.numeric { text-align: right; }

    .models__table thead th .sort-arrow {
      display: inline-block;
      margin-left: 6px;
      font-size: 10px;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .models__table thead th:hover .sort-arrow { opacity: 0.4; }
    .models__table thead th.sorted .sort-arrow { opacity: 1; }
    .models__table thead th.sorted.desc .sort-arrow { transform: rotate(180deg); }

    .models__table tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }

    .models__table tbody tr:last-child td { border-bottom: none; }
    .models__table tbody tr:hover td { background: rgba(245, 240, 220, 0.025); }

    .models__table td.numeric {
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--text-dim);
    }

    .models__table td.name-cell { min-width: 240px; }

    .models__table td.name-cell .name-link {
      display: inline-block;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 15px;
      color: var(--text-bright);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }
    .models__table td.name-cell .name-link:hover { border-bottom-color: var(--border-strong); }

    .models__table td.name-cell .full-name {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .models__table td.authors-cell { color: var(--text-dim); }

    .models__table td.year-cell {
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .models__table td.format-cell {
      color: var(--text-dim);
      font-size: 12px;
      max-width: 280px;
      line-height: 1.4;
    }

    .models__table td .badge {
      display: inline-block;
      padding: 3px 9px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .models__loading {
      text-align: center;
      padding: 60px 20px !important;
      color: var(--text-dim);
      font-style: italic;
      font-family: var(--serif);
    }

    .models__error {
      color: #d97757;
      text-align: center;
      padding: 40px 20px !important;
      font-style: italic;
      font-family: var(--serif);
    }

    /* ---------- FOOTER ---------- */
    footer { padding: 50px 0 60px; }

    .footer__inner {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer__credit em { font-family: var(--serif); font-style: italic; color: var(--text-dim); }
    .footer__separator { color: var(--text-muted); opacity: 0.7; margin: 0 2px; }

    .footer__links { display: flex; gap: 22px; flex-wrap: wrap; }
    .footer__links a { color: var(--text-dim); transition: color 0.2s ease; }
    .footer__links a:hover { color: var(--text-bright); }
    .footer__links a::after { content: ' ↗'; font-size: 11px; opacity: 0.7; }

    /* ---------- LANG OVERRIDES ---------- */
    :lang(zh) .hero__title,
    :lang(ja) .hero__title,
    :lang(ko) .hero__title {
      word-break: break-all;
      hyphens: none;
    }

    :lang(de) .hero__title { hyphens: auto; }

    /* ---------- MOBILE ---------- */
    @media (max-width: 900px) {
      :root { --wrap-pad: 20px; }
      .hero { padding: 40px 0 40px; }
      .hero__meta { gap: 24px; }
      .section { padding: 40px 0 60px; }
      .models__controls { flex-direction: column; align-items: stretch; }
      .models__search { width: 100%; }
      .footer__inner { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 480px) {
      .header__nav { gap: 14px; font-size: 12.5px; }
      .lang__menu { right: -8px; min-width: 150px; }
    }
  </style>
</head>

        <div class="models__table-wrap">

            <tbody id="models-body">
              <tr><td colspan="6" class="models__loading" data-i18n="loading">Загрузка…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap">

    // ---------- DATA ----------
    const DATA_URL  = 'https://raw.githubusercontent.com/seregannj/benchlmirror/main/data/benchmarks.json';
    const CACHE_KEY = 'blm_benchmarks_cache';
    const CACHE_TTL = 60 * 60 * 1000;

    let allItems = [];
    let currentSort = { column: 'year', direction: 'desc' };
    let searchQuery = '';

    async function fetchData() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          if (Date.now() - timestamp < CACHE_TTL) return data;
        }
      } catch (e) {}

      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
      } catch (e) {}

      return data;
    }

    // ---------- HELPERS ----------
    function getValue(item, column) {
      switch (column) {
        case 'name':           return item.name ?? '';
        case 'categoryLabel':  return item.categoryLabel ?? '';
        case 'authors':        return item.authors ?? '';
        case 'year':           return item.year ?? 0;
        case 'displayableScoreCount': return item.displayableScoreCount ?? 0;
        case 'format':         return item.format ?? '';
      }
      return '';
    }

    function sortItems(items, column, direction) {
      return [...items].sort((a, b) => {
        const va = getValue(a, column);
        const vb = getValue(b, column);

        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;

        if (typeof va === 'string') {
          const cmp = va.localeCompare(vb, undefined, { sensitivity: 'base' });
          return direction === 'asc' ? cmp : -cmp;
        }

        return direction === 'asc' ? va - vb : vb - va;
      });
    }

    function filterItems(items, query) {
      if (!query) return items;
      const q = query.toLowerCase();
      return items.filter(item =>
        (item.name        || '').toLowerCase().includes(q) ||
        (item.fullName    || '').toLowerCase().includes(q) ||
        (item.description || '').toLowerCase().includes(q) ||
        (item.authors     || '').toLowerCase().includes(q) ||
        (item.categoryLabel || '').toLowerCase().includes(q)
      );
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ---------- RENDER ----------
    function renderHeader() {
      const lang = document.documentElement.lang || 'ru';
      const dict = I18N[lang] || I18N.ru;
      const head = document.getElementById('models-head');
      head.innerHTML = `
        <tr>
          <th data-sort="name">${dict.col_name}<span class="sort-arrow">↑</span></th>
          <th data-sort="categoryLabel">${dict.col_category}<span class="sort-arrow">↑</span></th>
          <th data-sort="authors">${dict.col_authors}<span class="sort-arrow">↑</span></th>
          <th data-sort="year"           class="numeric">${dict.col_year}<span class="sort-arrow">↑</span></th>
          <th data-sort="displayableScoreCount" class="numeric">${dict.col_models}<span class="sort-arrow">↑</span></th>
          <th data-sort="format">${dict.col_format}<span class="sort-arrow">↑</span></th>
        </tr>
      `;
      head.querySelectorAll('th').forEach(th => {
        th.addEventListener('click', () => applySort(th.dataset.sort));
      });
      updateSortIndicators();
    }

    function renderBody(items) {
      const tbody = document.getElementById('models-body');
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="models__loading">—</td></tr>';
        return;
      }
      tbody.innerHTML = items.map(item => `
        <tr>
          <td class="name-cell">
            ${item.url
              ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener" class="name-link" title="${escapeHtml(item.description || '')}">${escapeHtml(item.name || '—')}</a>`
              : `<span class="name-link">${escapeHtml(item.name || '—')}</span>`}
            ${item.fullName && item.fullName !== item.name
              ? `<div class="full-name">${escapeHtml(item.fullName)}</div>`
              : ''}
          </td>
          <td><span class="badge">${escapeHtml(item.categoryLabel || '—')}</span></td>
          <td class="authors-cell">${escapeHtml(item.authors || '—')}</td>
          <td class="numeric year-cell">${escapeHtml(item.year || '—')}</td>
          <td class="numeric">${escapeHtml(item.displayableScoreCount ?? '—')}</td>
          <td class="format-cell">${escapeHtml(item.format || '—')}</td>
        </tr>
      `).join('');
    }

    function updateSortIndicators() {
      document.querySelectorAll('.models__table thead th').forEach(th => {
        const isActive = th.dataset.sort === currentSort.column;
        th.classList.toggle('sorted', isActive);
        th.classList.toggle('desc', isActive && currentSort.direction === 'desc');
      });
    }

    function rerender() {
      const filtered = filterItems(allItems, searchQuery);
      const sorted   = sortItems(filtered, currentSort.column, currentSort.direction);
      renderBody(sorted);
      document.getElementById('count').textContent = sorted.length;
    }

    function applySort(column) {
      if (currentSort.column === column) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.column = column;
        currentSort.direction = 'asc';
      }
      updateSortIndicators();
      rerender();
    }

    // ---------- I18N ----------
    function detectLang() {
      const stored = localStorage.getItem('blm_lang');
      if (stored && SUPPORTED.includes(stored)) return stored;
      const browser = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ru').toLowerCase().slice(0, 2);
      return SUPPORTED.includes(browser) ? browser : 'ru';
    }

    function setLang(lang) {
      if (!I18N[lang]) return;
      const dict = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key] !== undefined) el.textContent = dict[key];
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (dict[key] !== undefined) el.placeholder = dict[key];
      });
      localStorage.setItem('blm_lang', lang);
      document.documentElement.lang = lang;
      document.title = 'BenchLMirror — ' + dict.page_title;
      const code = document.querySelector('.lang__code');
      if (code) code.textContent = lang.toUpperCase();
      document.querySelectorAll('.lang__menu button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
      });
      renderHeader();
    }

    // ---------- LANG PICKER ----------
    const langBtn  = document.querySelector('.lang__btn');
    const langMenu = document.querySelector('.lang__menu');

    if (langBtn && langMenu) {
      langBtn.addEventListener('click', e => {
        e.stopPropagation();
        const opening = langMenu.hidden;
        langMenu.hidden = !opening;
        langBtn.setAttribute('aria-expanded', String(opening));
      });

      document.addEventListener('click', e => {
        if (!e.target.closest('.lang')) {
          langMenu.hidden = true;
          langBtn.setAttribute('aria-expanded', 'false');
        }
      });

      document.querySelectorAll('.lang__menu button').forEach(btn => {
        btn.addEventListener('click', () => {
          setLang(btn.getAttribute('data-lang'));
          langMenu.hidden = true;
          langBtn.setAttribute('aria-expanded', 'false');
        });
      });
    }

    // ---------- SEARCH ----------
    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value;
      rerender();
    });

    // ---------- INIT ----------
    (async function init() {
      setLang(detectLang());

      try {
        const data = await fetchData();
        allItems = data.items || [];

        if (data.sourceLastUpdated) {
          document.getElementById('meta-updated').textContent = data.sourceLastUpdated;
        }
        if (data.counts && data.counts.benchmarks != null) {
          document.getElementById('meta-total').textContent = data.counts.benchmarks;
        }

        rerender();
      } catch (e) {
        const lang = document.documentElement.lang || 'ru';
        const dict = I18N[lang] || I18N.ru;
        document.getElementById('models-body').innerHTML =
          `<tr><td colspan="6" class="models__error">${escapeHtml(dict.error)}</td></tr>`;
        document.getElementById('count').textContent = '0';
      }
    })();
  </script>
