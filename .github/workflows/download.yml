name: Daily download from BenchLM

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check dependencies
        run: |
          jq --version
          curl --version

      - name: Download and validate files
        run: |
          mkdir -p data
          mkdir -p .tmp

          files=(
            "models.json"
            "leaderboard.json"
            "benchmarks.json"
            "pricing.json"
            "speed.json"
            "comparisons.json"
          )

          failed=0

          for name in "${files[@]}"; do
            url="https://benchlm.ai/data/$name"
            tmp=".tmp/$name"

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⬇️ Downloading $name"
            echo "🔗 $url"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if ! curl -L -f --retry 3 --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 120 \
              "$url" -o "$tmp"; then

              echo "❌ Download failed: $name"
              failed=1
              rm -f "$tmp"
              continue
            fi

            echo "🔍 Validating JSON..."

            if ! jq empty "$tmp" 2>/dev/null; then
              echo "❌ Invalid JSON: $name"
              failed=1
              rm -f "$tmp"
              continue
            fi

            if [ ! -s "$tmp" ]; then
              echo "❌ Empty file: $name"
              failed=1
              rm -f "$tmp"
              continue
            fi

            mv "$tmp" "data/$name"

            echo "✅ $name downloaded and validated"
          done

          rm -rf .tmp

          echo ""
          echo "📁 Current data files:"
          ls -lh data/

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "⚠️ One or more files failed."
            echo "Existing valid files were preserved."
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/

          if git diff --staged --quiet; then
            echo "ℹ️ No changes"
          else
            git commit -m "Automated update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
